<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Page Horizontal Frames</title>
    <style>
        /* Reset and layout */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Navigation Bar (Top Frame) */
        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 4px;
            background-color: #444;
        }

        nav a:hover {
            background-color: #555;
        }

        /* Content Area (Bottom Frame) */
        .frame-container {
            flex: 1;
            position: relative;
            background-color: #f4f4f4;
        }

        /* Individual Content Frames */
        .frame {
            display: none; /* Hides all frames by default */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Active Frame State */
        .frame.active {
            display: block; /* Shows only the active frame */
        }
    </style>
</head>
<body>

    <!-- Navigation Menu -->
    <nav>
        <a href="#" onclick="showFrame('frame1')">Frame 1</a>
        <a href="#" onclick="showFrame('frame2')">Frame 2</a>
        <a href="#" onclick="showFrame('frame3')">Frame 3</a>
    </nav>

    <!-- Content Container -->
    <div class="frame-container">
        
        <!-- Frame 1 -->
        <div id="frame1" class="frame active">
            <h2>Welcome to Frame 1</h2>
            <p>This is the default visible content area.</p>
        </div>

        <!-- Frame 2 -->
        <div id="frame2" class="frame">
            <h2>Welcome to Frame 2</h2>
            <p>This content was hidden until you clicked the link.</p>
        </div>

        <!-- Frame 3 -->
        <div id="frame3" class="frame">
            <h2>Welcome to Frame 3</h2>
            <p>You can add as many horizontal frames as you need.</p>
        </div>

    </div>

    <!-- JavaScript to toggle views -->
    <script>
        function showFrame(frameId) {
            // 1. Find all elements with the class 'frame'
            const frames = document.querySelectorAll('.frame');
            
            // 2. Loop through and hide them all
            frames.forEach(frame => {
                frame.classList.remove('active');
            });

            // 3. Show the specific frame that was clicked
            document.getElementById(frameId).classList.add('active');
        }
    </script>

</body>
</html>
